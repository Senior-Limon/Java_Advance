spring.datasource.url=jdbc:postgresql://localhost:5432/order_service_db
spring.datasource.username=${DB_USER:postgres}
logging.level.liquibase=DEBUG
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.datasource.password=${DB_PASSWORD:12345}
spring.kafka.bootstrap-servers=localhost:9092
# === REST Client
user.service.url=http://localhost:8081


resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=30s
resilience4j.timelimiter.instances.userService.timeout-duration=3s