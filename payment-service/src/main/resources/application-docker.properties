# === Application Info ===
spring.application.name=payment-service
server.port=8080

# === MongoDB (Docker Network) ===
spring.mongodb.uri=mongodb://mongo:27017/payment_service_db

# === Security (JWT Resource Server) ===
jwt.secret=${JWT_SECRET}

# === Kafka (Docker Network) ===
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.type.mapping=payment_event:com.inno.task.payment_service.dto.PaymentEvent

# === Logging ===
logging.level.com.inno.task.payment_service=INFO